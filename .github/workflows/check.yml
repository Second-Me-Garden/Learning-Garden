name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: site integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: |
          for f in assets/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Site integrity (links, diagrams, captions, required sections)
        run: node scripts/check-site.mjs
      - name: No external scripts or inline handlers
        run: |
          set -e
          if grep -rn --include=*.html -E '<script[^>]+src="https?://' . ; then echo "external script found"; exit 1; fi
          if grep -rn --include=*.html -E ' on[a-z]+="' . ; then echo "inline event handler found"; exit 1; fi
          echo OK
